services:
  - type: web
    name: smart-nail-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: smart-nail-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: smart-nail-db
    plan: free
    databaseName: smart_nail_db
    user: smart_nail_user

