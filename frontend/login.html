<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Nail Health Monitoring System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html" style="color: inherit;"><i class="fa-solid fa-heart-pulse"></i> NailHealth</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="card auth-card">
            <h2 class="auth-title">Welcome Back</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-icon-wrapper">
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        <i class="fa-solid fa-eye toggle-password"></i>
                    </div>
                    <div class="text-center mt-1" style="text-align: right;">
                        <a href="forgot.html" style="font-size: 0.9rem;">Forgot Password?</a>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="loginBtn">
                    Login
                </button>
            </form>
            <div class="text-center mt-2">
                <span style="color: var(--text-secondary);">Don't have an account?</span>
                <a href="signup.html" style="font-weight: 600;">Create Account</a>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
