<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Reports - Smart Nail Health Monitoring System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--mint); color: var(--primary); }
        .risk-badge { padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .risk-low { background-color: var(--success); color: white; }
        .risk-moderate { background-color: var(--warning); color: white; }
        .risk-high { background-color: var(--danger); color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">
            <a href="admin.html" style="color: inherit;"><i class="fa-solid fa-heart-pulse"></i> Admin Panel</a>
        </div>
        <button class="hamburger"><i class="fa-solid fa-bars"></i></button>
        <div class="nav-links">
            <a href="admin.html">Overview</a>
            <a href="admin-users.html">Users</a>
            <a href="admin-reports.html" class="active">Reports</a>
            <a href="#" onclick="logout(); return false;">Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <h1 class="mb-2">System Analysis Reports</h1>
        <div class="card">
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Report ID</th>
                            <th>User</th>
                            <th>Score</th>
                            <th>Risk Level</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="reportsTableBody">
                        <tr><td colspan="6" class="text-center">Loading reports...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("access_token");
            if (!token) { window.location.href = "login.html"; return; }
            
            try {
                const response = await fetch(`${API_BASE_URL}/admin/reports`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                if (response.status === 403) {
                    window.location.href = "dashboard.html";
                    return;
                }
                const result = await response.json();
                const tbody = document.getElementById("reportsTableBody");
                if (result.success && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(r => `
                        <tr>
                            <td>#${r.id}</td>
                            <td>${r.user_name}</td>
                            <td><strong>${r.health_score}</strong>/100</td>
                            <td><span class="risk-badge risk-${r.risk_level.toLowerCase()}">${r.risk_level}</span></td>
                            <td>${new Date(r.created_at).toLocaleDateString()}</td>
                            <td><a href="result.html?id=${r.id}" class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.8rem;">View</a></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center">No reports found.</td></tr>';
                }
            } catch (err) {
                showToast("Network error", "error");
            }
        });
    </script>
</body>
</html>
